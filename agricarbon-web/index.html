<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AGRiCARBON</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#16a34a', // green-600
                        secondary: '#4ade80', // green-400
                        bg: '#f0fdf4', // green-50
                    }
                }
            }
        }
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .hidden { display: none !important; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body class="bg-bg font-sans text-gray-800 antialiased min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-primary text-white shadow-md p-4 sticky top-0 z-50">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold cursor-pointer" onclick="navigate('home')">
                <i class="fa-solid fa-leaf mr-2"></i>AGRiCARBON
            </h1>
            <nav class="space-x-4 hidden md:flex">
                <button onclick="navigate('home')" class="hover:text-green-200"><i class="fa-solid fa-home"></i> Trang chủ</button>
                <button onclick="navigate('create-garden')" class="hover:text-green-200"><i class="fa-solid fa-seedling"></i> Tạo vườn</button>
            </nav>
            <button class="md:hidden text-2xl" id="menu-btn"><i class="fa-solid fa-bars"></i></button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow container mx-auto p-4 md:p-6" id="app-container">
        <!-- Render content here via JS -->
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-green-200 p-4 text-center text-sm text-gray-500">
        <p>&copy; 2026 AGRiCARBON. Đo đúng – Bón đúng – Giảm phát thải – Tăng giá trị.</p>
    </footer>

    <!-- App Logic -->
    <script src="app.js"></script>
</body>
</html>
